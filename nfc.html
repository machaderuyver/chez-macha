<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1f3d;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 20px 48px;font-family:-apple-system,sans-serif}
.nfc-badge{display:inline-flex;align-items:center;gap:6px;background:#162340;border:0.5px solid #2a3f6a;border-radius:20px;padding:5px 14px;color:#8a9ab5;font-size:11px;margin-bottom:20px}

.subtitle{color:#8a9ab5;font-size:14px;margin-bottom:28px;text-align:center}
.btn-grid{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;background:#162340;border:0.5px solid #2a3f6a;border-radius:14px;padding:16px 18px;text-decoration:none}
.btn-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.btn-label{color:#fff;font-size:15px;font-weight:600;display:block}
.btn-sub{color:#8a9ab5;font-size:12px;margin-top:2px;display:block}
.btn-arrow{color:#8a9ab5;margin-left:auto;font-size:20px}
hr{width:100%;max-width:360px;border:none;border-top:0.5px solid #2a3f6a;margin:4px 0}
.footer{color:#3a4e6a;font-size:11px;margin-top:28px;text-align:center}
